 [project]
name = "forgequeue"
version = "0.1.0"
description = "A distributed media-processing platform built with Python"
requires-python = ">=3.14"
dependencies = [
	"Pillow>=12,<13",
	"fastapi[standard-no-fastapi-cloud-cli]>=0.141,<0.142",
	"SQLAlchemy>=2.0.52,<2.1",
	"psycopg[binary]>=3.3,<4",
]

[project.optional-dependencies]
dev = [
	"pytest>=9,<10",
	"alembic>=1.19,<2",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]