services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: forgequeue_dev
      POSTGRES_USER: forgequeue_app
      POSTGRES_PASSWORD: forgequeue_dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgequeue_app -d forgequeue_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app-environment
      FORGEQUEUE_DB_USER: forgequeue_app
      FORGEQUEUE_DB_PASSWORD: forgequeue_dev_password
      FORGEQUEUE_DB_HOST: postgres
      FORGEQUEUE_DB_PORT: "5432"
      FORGEQUEUE_DB_NAME: forgequeue_dev
      FORGEQUEUE_REDIS_URL: redis://redis:6379/0
      FORGEQUEUE_RESULT_DIR: /app/storage/results
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment: *app-environment
    ports:
      - "8000:8000"
    volumes:
      - media-data:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment: *app-environment
    volumes:
      - media-data:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      replicas: 2

volumes:
  postgres-data:
  redis-data:
  media-data:
